site_name: orangeboot 的博客
site_description: 记录嵌入式开发的学习和技术
site_url: https://orangeboot4243.github.io/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chip
  palette:
    - scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 学习笔记:
      - 概览: notes.md
      - 嵌入式:
          - micro-ROS:
              - 专题概览: embedded/micro-ROS/index.md
              - micro-ROS 简介: embedded/micro-ROS/micro-ROS简介.md
              - 详细配置指南: embedded/micro-ROS/详细配置指南/详细配置指南.md
              - 嵌入战队模板: embedded/micro-ROS/嵌入战队模板/嵌入战队模板.md
              - 自定义消息: embedded/micro-ROS/自定义消息.md
              - 中间件配置: embedded/micro-ROS/中间件配置/中间件配置.md
              - 网口传输: embedded/micro-ROS/网口传输/网口传输.md

plugins:
  - search

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
