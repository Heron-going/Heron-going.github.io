site_name: Heron-going 的笔记
site_description: 记录嵌入式开发的学习过程、遇到的问题和解决方法
site_url: https://Heron-going.github.io/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/chip
  palette:
    - scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 首页: index.md
  - 学习笔记:
      - 概览: notes.md
      - 嵌入式:
          - STM32:
              - 环境搭建:
                  - 鸿蒙 Windows 虚拟机开发与调试: embedded/stm32/环境搭建/鸿蒙虚拟机开发/鸿蒙虚拟机开发.md
              - 外设:
                  - GPIO 工作模式与寄存器: embedded/stm32/外设/GPIO/GPIO.md
                  - 外部中断原理: embedded/stm32/外设/外部中断/外部中断.md
          - micro-ROS:
              - 专题概览: embedded/micro-ROS/index.md
              - micro-ROS 简介: embedded/micro-ROS/micro-ROS简介.md
              - 详细配置指南: embedded/micro-ROS/详细配置指南/详细配置指南.md
              - 嵌入战队模板: embedded/micro-ROS/嵌入战队模板/嵌入战队模板.md
              - 自定义消息: embedded/micro-ROS/自定义消息/自定义消息.md
              - 自定义静态库: embedded/micro-ROS/自定义静态库/自定义静态库.md
              - 中间件配置: embedded/micro-ROS/中间件配置/中间件配置.md
              - 网口传输: embedded/micro-ROS/网口传输/网口传输.md

plugins:
  - search

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/notes.js
